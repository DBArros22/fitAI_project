<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI Pro - Gestor de Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-gray-100 font-sans min-h-screen">

    <nav class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#111827] sticky top-0 z-50">
        <h1 class="text-xl font-black text-blue-500 tracking-tighter italic">FITAI <span class="text-white text-xs font-normal not-italic">PRO</span></h1>
        <div id="data-atual" class="text-xs font-bold text-gray-400 bg-gray-800 px-3 py-1 rounded-full"></div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            <section class="bg-[#111827] p-5 rounded-2xl border border-gray-800 shadow-xl">
                <h3 class="text-sm font-bold text-gray-400 uppercase mb-4 tracking-widest text-center">Frequência Semanal</h3>
                <div id="calendario" class="grid grid-cols-7 gap-2">
                    </div>
            </section>

            <section class="bg-[#111827] p-6 rounded-2xl border border-gray-800 border-t-4 border-t-blue-500">
    <h3 class="text-lg font-bold mb-4 italic">REGISTRAR TREINO</h3>
    <div class="space-y-4">
        <div>
            <label class="text-[10px] uppercase font-bold text-gray-500 ml-1">1. Grupamento</label>
            <select id="select-grupo" onchange="atualizarListaExercicios()" class="w-full bg-[#0b0f1a] border border-gray-700 p-3 rounded-xl focus:border-blue-500 outline-none transition-all text-sm font-bold">
                <option value="Peito">Peito</option>
                <option value="Costas">Costas</option>
                <option value="Pernas">Pernas</option>
                <option value="Ombros">Ombros</option>
                <option value="Braços">Braços</option>
                <option value="Core">Core / Abdominal</option>
            </select>
        </div>
        
        <div>
            <label class="text-[10px] uppercase font-bold text-gray-500 ml-1">2. Exercício Específico</label>
            <select id="select-exercicio" class="w-full bg-[#0b0f1a] border border-gray-700 p-3 rounded-xl focus:border-blue-500 outline-none transition-all text-sm">
                </select>
        </div>
        
        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 ml-1">Séries</label>
                <input type="number" id="series-ex" placeholder="0" class="w-full bg-[#0b0f1a] border border-gray-700 p-3 rounded-xl focus:border-blue-500 outline-none text-center">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 ml-1">Reps</label>
                <input type="number" id="reps-ex" placeholder="0" class="w-full bg-[#0b0f1a] border border-gray-700 p-3 rounded-xl focus:border-blue-500 outline-none text-center">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 ml-1">Carga</label>
                <input type="number" id="carga-ex" placeholder="Kg" class="w-full bg-[#0b0f1a] border border-gray-700 p-3 rounded-xl focus:border-blue-500 outline-none text-center">
            </div>
        </div>

        <button onclick="adicionarExercicio()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all shadow-lg uppercase text-sm tracking-widest mt-2">Salvar Exercício</button>
    </div>
</section>

        </div>

        <div class="lg:col-span-8">
            <div class="bg-[#111827] rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
                <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-[#161e2e]">
                    <div>
                        <h2 class="text-xl font-bold">Log de Performance</h2>
                        <p class="text-xs text-gray-500">Histórico de volume e intensidade</p>
                    </div>
                    <button onclick="limparTreino()" class="text-xs bg-red-900/20 text-red-400 px-3 py-1 rounded-md hover:bg-red-900/40 transition-all">Limpar Log</button>
                </div>

                <div id="lista-treino" class="p-6 space-y-4 max-h-[600px] overflow-y-auto">
                    </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
