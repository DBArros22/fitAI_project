<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssistFit Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body class="fade-in">

<div id="view-login">
    <div class="auth-card">
        <h1 class="logo-main italic-bold">ASSISTFIT <span>PRO</span></h1>
        
        <div class="tab-system" id="auth-tab-selector">
            <button onclick="toggleAuthTab('login')" id="btn-tab-login" class="tab-btn active">Entrar</button>
            <button onclick="toggleAuthTab('cadastro')" id="btn-tab-cadastro" class="tab-btn">Cadastrar</button>
        </div>

        <div id="form-login" class="form-group">
            <input type="email" id="login-email" placeholder="E-mail de acesso" class="input-field">
            <input type="password" id="login-pass" placeholder="Sua senha" class="input-field">
            <button onclick="handleLogin()" class="btn-primary">Acessar Painel</button>
            <button onclick="handleRecuperar()" class="btn-link">Esqueceu a senha?</button>
        </div>

        <div id="form-cadastro" class="form-group hidden">
            <input type="text" id="reg-nome" placeholder="Nome Completo" class="input-field">
            <input type="email" id="reg-email" placeholder="E-mail" class="input-field">
            <input type="tel" id="reg-tel" placeholder="WhatsApp" class="input-field">
            <div class="grid-2">
                <input type="password" id="reg-pass" placeholder="Senha" class="input-field">
                <input type="password" id="reg-pass-conf" placeholder="Confirmar" class="input-field">
            </div>
            <button onclick="handleCadastro()" class="btn-primary success">Criar minha conta</button>
        </div>
    </div>
</div>

<div id="app-shell" class="hidden">
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button onclick="showView('lobby')" class="btn-link" style="font-size: 1.5rem;">🏠</button>
            <h1 class="italic-bold" style="color: var(--accent-blue); font-size: 1.5rem;"> AssisFiT <span style="color: white; font-size: 0.7rem;">PRO</span></h1>
        </div>
        <button onclick="logout()" class="btn-link" style="color: #ef4444; font-weight: bold;">SAIR</button>
    </nav>

  <main id="view-lobby" class="content-grid">
    <div onclick="showView('planilhas')" class="menu-card">
        <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        </div>
        <h3 class="italic-bold uppercase">Registrar Treino</h3>
        <p>Crie e edite seus treinos.</p>
    </div>

    <div onclick="showView('calendario')" class="menu-card">
        <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <h3 class="italic-bold uppercase">Cronograma</h3>
        <p>Planejamento semanal.</p>
    </div>

    <div onclick="showView('blog')" class="menu-card">
        <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        </div>
        <h3 class="italic-bold uppercase">Evolução</h3>
        <p>Blog pessoal e progresso.</p>
    </div>

    <div onclick="showView('consulta-geral')" class="menu-card">
        <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <h3 class="italic-bold uppercase">Consultar</h3>
        <p>Visualize seus treinos.</p>
    </div>
</main>

    </main>

    <main id="view-planilhas" class="hidden" style="padding: 20px 5%;">
        <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="italic-bold">MEUS TREINOS</h2>
                <button onclick="criarNovaFicha()" class="btn-primary" style="width: auto; padding: 10px 20px;">+ NOVA</button>
            </div>
            <div id="lista-fichas" class="form-group"></div>
        </div>
    </main>

    <main id="view-consulta" class="hidden" style="padding: 20px 5%;">
        <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="titulo-consulta" class="italic-bold" style="color: var(--accent-blue);">NOME DA FICHA</h2>
                <button onclick="showView('planilhas')" class="btn-link">Voltar</button>
            </div>
            <div id="lista-exercicios-estaticos" class="form-group"></div>
            <button onclick="prepararRegistro()" class="btn-primary" style="margin-top: 20px;"> Adicionar exercícios </button>
        </div>
    </main>

    <main id="view-consulta-geral" class="hidden" style="padding: 20px 5%;">
        <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="cabecalho-consulta" class="italic-bold uppercase" style="color: var(--accent-blue);">Consultar Treinos</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="voltarListaConsulta()" id="btn-voltar-consulta" class="btn-link hidden">← Voltar</button>
                    <button onclick="showView('lobby')" id="btn-sair-consulta" class="btn-link">Sair</button>
                </div>
            </div>
            <div id="lista-nomes-treinos" class="grid-2" style="gap: 15px;"></div>
            <div id="detalhes-treino-consulta" class="hidden"></div>
        </div>
    </main>

    <main id="view-registro" class="hidden registro-container">
        <aside class="form-group">
            <section class="glass-panel">
                <h3 id="nome-ficha-ativa" class="italic-bold" style="margin-bottom: 15px; color: var(--accent-blue); text-transform: uppercase;">NOVO SET</h3>
                <div class="form-group">
                    <select id="select-grupo" onchange="atualizarListaExercicios()" class="input-field">
                        <option value="">Selecione o Grupo...</option>
                        <option value="Peitoral">Peitoral</option>
                        <option value="Dorsais">Dorsais</option>
                        <option value="Quadríceps">Quadríceps</option>
                        <option value="Posteriores/Glúteos">Posteriores/Glúteos</option>
                        <option value="Deltoides (Ombros)">Deltoides (Ombros)</option>
                        <option value="Bíceps/Braquial">Bíceps/Braquial</option>
                        <option value="Tríceps Braquial">Tríceps Braquial</option>
                        <option value="Core/Abdominal">Core/Abdominal</option>
                        <option value="Panturrilhas">Panturrilhas</option>
                        <option value="Cardio & Aeróbico">Cardio & Aeróbico</option>
                    </select>
                    
                    <select id="select-exercicio" class="input-field"></select>

                    <div id="campos-forca" class="grid-3">
                        <input type="number" id="series-ex" placeholder="Sets" class="input-field">
                        <input type="number" id="reps-ex" placeholder="Reps" class="input-field">
                        <input type="number" id="carga-ex" placeholder="Kg" class="input-field">
                    </div>

                    <div id="campos-cardio" class="hidden">                 
                        <div style="position: relative; width: 100%;">
                            <input type="text" id="tempo-ex" placeholder="00:00:00" inputmode="numeric" oninput="mascaraTempo(this)" class="input-field" style="width: 100%; letter-spacing: 2px; font-weight: bold; text-align: center;">
                            <small style="color: gray; font-size: 9px; display: block; text-align: center; margin-top: 5px;">FORMATO: HH:MM:SS</small>
                        </div>
                    </div>

                    <button onclick="adicionarExercicio()" class="btn-primary" style="margin-top:10px;">Salvar</button>
                    <button onclick="showView('planilhas')" class="btn-link">← Voltar</button>
                </div>
            </section>
        </aside>

        <section class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="italic-bold">LOG DE PERFORMANCE</h2>
                <button onclick="limparTreino()" style="color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.7rem; font-weight: bold;">LIMPAR</button>
            </div>
            <div id="lista-treino"></div>
        </section>
    </main>

    <main id="view-blog" class="hidden"></main>
    <main id="view-calendario" class="hidden"></main>

</div> <script src="script.js"></script>
</body>
</html>
