<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI - Seu Personal Trainer Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-500 underline decoration-2">FitAI</h1>
        <span class="text-xs text-gray-400">Status: <span class="text-green-500 font-mono">Online</span></span>
    </nav>

    <main class="max-w-4xl mx-auto mt-10 p-4">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-extrabold mb-2">Treino Gerado por IA</h2>
            <p class="text-gray-400">IA especializada em hipertrofia e performance.</p>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700">
            <textarea id="userInput" class="w-full bg-gray-900 border border-gray-700 p-4 rounded-lg focus:outline-none focus:border-blue-500" rows="3" placeholder="Ex: Sou iniciante, quero treinar 3x por semana focado em peito e pernas..."></textarea>
            
            <button onclick="gerarTreino()" id="btnGerar" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all">
                Gerar Plano de Treino
            </button>
        </div>

        <div id="resultado" class="mt-8 hidden p-6 bg-gray-800 rounded-xl border-l-4 border-blue-500">
            <h3 class="text-xl font-bold mb-4">Sugestão do FitAI:</h3>
            <div id="textoIA" class="text-gray-300 leading-relaxed whitespace-pre-line">
                </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
